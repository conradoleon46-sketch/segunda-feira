<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Segunda-Feira — Central Inteligente de Dropshipping</title>
  <meta name="description" content="Central inteligente de dropshipping sem estoque próprio com simulação financeira, análise de fornecedores, calculadora de lucro e agente de IA." />
  <meta name="theme-color" content="#d4af37" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Segunda-Feira" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2309090d' stroke='%23d4af37' stroke-width='3'/%3E%3Cpath d='M32 10 L46 24 L40 34 L48 48 L32 42 L16 48 L24 34 L18 24 Z' fill='none' stroke='%23f5d77f' stroke-width='3'/%3E%3Ccircle cx='32' cy='28' r='5' fill='%23d4af37'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-void: #07070b;
      --bg-panel: rgba(10, 10, 15, 0.86);
      --bg-input: #11121a;
      --gold-bright: #f5d77f;
      --gold-primary: #d4af37;
      --gold-border: rgba(212, 175, 55, 0.42);
      --text-main: #f2eee5;
      --text-muted: #a69f91;
      --success: #45c486;
      --danger: #e05d5d;
      --warning: #e5a93c;
      --font-display: 'Cinzel', Georgia, serif;
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --radius: 14px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg-void);
      color: var(--text-main);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Camadas Cinematográficas de Profundidade */
    .realm-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .sky-atmosphere {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 75% 18%, rgba(114, 152, 235, 0.22), transparent 42%),
        radial-gradient(circle at 50% 48%, rgba(212, 175, 55, 0.16), transparent 55%),
        radial-gradient(circle at 10% 80%, rgba(190, 95, 28, 0.18), transparent 45%),
        linear-gradient(180deg, #050711 0%, #0b1020 48%, #09080c 100%);
    }

    .parallax-landscape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.92;
      transition: transform 0.25s ease-out;
    }

    .castle-lights rect {
      animation: torchFlicker 3.2s infinite alternate ease-in-out;
    }

    @keyframes torchFlicker {
      0% { opacity: 0.55; }
      50% { opacity: 1; }
      100% { opacity: 0.72; }
    }

    .library-architecture {
      position: absolute;
      inset: 0;
    }

    .library-wing {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 130px;
      opacity: 0.52;
    }

    .library-left {
      left: 0;
      background:
        repeating-linear-gradient(180deg, rgba(22, 16, 12, 0.9) 0 4px, transparent 4px 58px),
        repeating-linear-gradient(90deg, #1b120e 0 12px, #2b1a12 12px 22px, #140e0b 22px 34px, #3b2616 34px 44px);
      border-right: 2px solid rgba(212, 175, 55, 0.22);
      box-shadow: inset -25px 0 40px #07070b;
    }

    .library-right {
      right: 0;
      background:
        repeating-linear-gradient(180deg, rgba(22, 16, 12, 0.9) 0 4px, transparent 4px 58px),
        repeating-linear-gradient(90deg, #140e0b 0 14px, #2e1d13 14px 26px, #1a120d 26px 38px);
      border-left: 2px solid rgba(212, 175, 55, 0.22);
      box-shadow: inset 25px 0 40px #07070b;
    }

    .candelabra-glow {
      position: absolute;
      top: 22%;
      left: 50%;
      width: 160px;
      height: 160px;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(255, 174, 54, 0.34), transparent 68%);
      animation: torchFlicker 2.6s infinite alternate;
    }

    .stone-arch-top {
      position: absolute;
      top: -120px;
      left: 50%;
      width: min(1150px, 95vw);
      height: 210px;
      transform: translateX(-50%);
      border-radius: 50%;
      border: 14px solid rgba(18, 18, 24, 0.78);
      box-shadow: 0 0 45px rgba(0, 0, 0, 0.85), inset 0 -2px 0 rgba(212, 175, 55, 0.22);
    }

    .dragon-stage {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .dragon-stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: radial-gradient(circle at center, transparent 42%, rgba(5, 5, 9, 0.82) 100%);
    }

    /* Painéis Pretos com Molduras Douradas */
    .gold-frame {
      position: relative;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius);
      box-shadow:
        0 14px 36px rgba(0, 0, 0, 0.68),
        inset 0 1px 0 rgba(245, 215, 127, 0.2),
        inset 0 0 22px rgba(212, 175, 55, 0.05);
    }

    .gold-frame::before,
    .gold-frame::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      pointer-events: none;
      border-color: var(--gold-bright);
      border-style: solid;
      opacity: 0.78;
    }

    .gold-frame::before {
      top: 4px; left: 4px;
      border-width: 2px 0 0 2px;
      border-top-left-radius: 6px;
    }

    .gold-frame::after {
      bottom: 4px; right: 4px;
      border-width: 0 2px 2px 0;
      border-bottom-right-radius: 6px;
    }

    .gold-frame-subtle {
      background: rgba(16, 16, 22, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 10px;
      padding: 12px 16px;
    }

    /* Layout Principal */
    .app-shell {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 18px;
      max-width: 1560px;
      margin: 0 auto;
      padding: 18px;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 18px;
      height: calc(100vh - 36px);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      gap: 14px;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .brand-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #fff2bf 0%, #d4af37 55%, #b18621 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand-subtitle { font-size: 0.75rem; color: var(--text-muted); }

    .sim-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(212, 175, 55, 0.09);
      border: 1px solid rgba(212, 175, 55, 0.28);
      color: var(--gold-bright);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold-bright);
      box-shadow: 0 0 8px var(--gold-bright);
      animation: pulseGlow 1.8s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      color: var(--text-main);
      background: rgba(212, 175, 55, 0.08);
      border-color: rgba(212, 175, 55, 0.22);
    }

    .nav-btn.active {
      color: var(--gold-bright);
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.04));
      border-color: var(--gold-primary);
      box-shadow: 0 0 14px rgba(212, 175, 55, 0.14);
    }

    .sidebar-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }

    .capital-mini-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(212, 175, 55, 0.25);
    }

    .main-column {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.25rem;
      color: var(--gold-bright);
    }

    .page-subtitle { margin: 2px 0 0; font-size: 0.82rem; color: var(--text-muted); }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(212, 175, 55, 0.28);
      font-size: 0.78rem;
    }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.online { background: var(--success); }
    .status-dot.offline { background: var(--warning); }

    .governance-banner { font-size: 0.82rem; color: #e4dcc8; line-height: 1.45; }

    /* Painéis e Grids */
    .workspace { display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px; }

    .tab-section {
      display: none;
      flex-direction: column;
      gap: 16px;
      animation: fadeSlide 0.25s ease-out;
    }

    .tab-section.active { display: flex; }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel { padding: 18px; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .wrap-header { flex-wrap: wrap; }

    .panel-header h3 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.05rem;
      color: var(--gold-bright);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .kpi-card { display: flex; flex-direction: column; gap: 6px; }

    .kpi-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .kpi-value { font-family: var(--font-display); font-size: 1.55rem; font-weight: 700; }
    .kpi-meta { font-size: 0.78rem; color: var(--text-muted); }

    .grid-2-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid-asymmetric { display: grid; grid-template-columns: 1.35fr 0.9fr; gap: 16px; align-items: start; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 12px;
    }

    .entity-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      background: rgba(7, 7, 11, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 12px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .entity-card:hover { border-color: var(--gold-primary); transform: translateY(-2px); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-title { margin: 0; font-size: 0.98rem; font-weight: 700; color: var(--text-main); }

    .tag-gold, .tag-status {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.73rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .tag-gold {
      background: rgba(212, 175, 55, 0.16);
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: var(--gold-bright);
    }

    .tag-status.ok { background: rgba(69, 196, 134, 0.14); border: 1px solid rgba(69, 196, 134, 0.45); color: #7ee8b4; }
    .tag-status.warn { background: rgba(229, 169, 60, 0.15); border: 1px solid rgba(229, 169, 60, 0.45); color: #ffd384; }
    .tag-status.muted { background: rgba(166, 159, 145, 0.15); border: 1px solid rgba(166, 159, 145, 0.35); color: var(--text-muted); }

    .meta-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; font-size: 0.8rem; color: var(--text-muted); }
    .meta-grid strong { color: var(--text-main); }

    /* Formulários e Botões */
    .form-stack { display: flex; flex-direction: column; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; font-size: 0.8rem; color: var(--text-muted); }
    .field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .field-row-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .spaced-row { margin: 12px 0; }

    .input-obsidian {
      width: 100%;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      background: var(--bg-input);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-obsidian:focus {
      border-color: var(--gold-bright);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.16);
    }

    input[type="range"] { width: 100%; accent-color: var(--gold-primary); }
    .range-field { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: var(--text-muted); }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-gold, .btn-gold-outline, .btn-obsidian, .btn-danger-outline, .icon-btn, .btn-link {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-gold {
      border: 1px solid var(--gold-bright);
      background: linear-gradient(135deg, #f1cf6f 0%, #c99c2a 100%);
      color: #0b0905;
    }
    .btn-gold:hover { filter: brightness(1.08); }

    .btn-gold-outline {
      border: 1px solid var(--gold-primary);
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-bright);
    }
    .btn-gold-outline:hover { background: rgba(212, 175, 55, 0.22); }

    .btn-obsidian {
      border: 1px solid rgba(212, 175, 55, 0.28);
      background: rgba(15, 16, 23, 0.9);
      color: var(--text-main);
    }
    .btn-obsidian:hover { border-color: var(--gold-primary); }

    .btn-danger-outline {
      border: 1px solid rgba(224, 93, 93, 0.45);
      background: rgba(224, 93, 93, 0.1);
      color: #ff9c9c;
    }

    .btn-link { background: transparent; border: none; padding: 4px; color: var(--gold-bright); }

    .icon-btn {
      padding: 8px 11px;
      background: rgba(15, 16, 23, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--gold-bright);
    }

    .btn-sm { padding: 6px 10px; font-size: 0.78rem; }

    /* Gráficos & Calculadora */
    .chart-box { width: 100%; min-height: 220px; display: flex; flex-direction: column; justify-content: center; }

    .calc-results-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }

    .metric-box {
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(212, 175, 55, 0.22);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-box span { font-size: 0.76rem; color: var(--text-muted); }
    .metric-box strong { font-size: 1.2rem; font-family: var(--font-display); }

    .stacked-bar {
      display: flex;
      height: 18px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.35);
      margin: 10px 0;
    }

    .breakdown-list, .context-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.83rem;
    }

    .breakdown-list li { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); }
    .dot-legend { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; }
    .lot-summary { margin-top: 14px; }
    .lot-summary h4, .breakdown-section h4, .ledger-wrap h4, .context-box h4 { margin: 0 0 6px; font-size: 0.88rem; color: var(--gold-bright); }

    /* Financeiro & Relatórios */
    .ledger-wrap { margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(212, 175, 55, 0.2); }

    .ledger-list, .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
    }

    .ledger-item, .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 9px;
      background: rgba(6, 7, 11, 0.82);
      border: 1px solid rgba(212, 175, 55, 0.2);
      font-size: 0.84rem;
    }

    .alloc-readonly { padding: 10px; border-radius: 8px; background: rgba(212, 175, 55, 0.08); font-size: 0.84rem; }
    .gold-divider { border: none; border-top: 1px solid rgba(212, 175, 55, 0.22); margin: 4px 0; }
    .report-summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }

    /* Chat IA */
    .chat-panel { display: flex; flex-direction: column; height: min(680px, 76vh); }
    .ai-identity { display: flex; align-items: center; gap: 10px; }

    .dragon-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.35rem;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.35), rgba(10, 10, 15, 0.95));
      border: 1px solid var(--gold-primary);
    }

    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 8px 4px; }

    .msg-bubble {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.5;
